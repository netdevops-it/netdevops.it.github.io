site_name: NetDevOps.it
site_description: "Network & Infra Automation – Tutorials • Blog • Courses"
site_url: https://netdevops.it/
site_author: Bart Smeding
repo_url: https://github.com/bsmeding/bsmeding.github.io
edit_uri: edit/main/docs/

plugins:
  - blog:
      post_url_format: "{slug}"
      blog_toc: true
      pagination_per_page: 4
  # `tags_file` was deprecated in mkdocs-material; the tag listing now lives
  # in docs/tags.md via the `<!-- material/tags -->` marker.
  - tags
  - search:
      lang: en
  - git-revision-date-localized
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
  # Auto-generates Open Graph / Twitter social cards.
  # Requires mkdocs-material[imaging] and Cairo system libs.
  # Set CARDS=false to skip during local serve if Cairo is unavailable.
  - social:
      cards: !ENV [CARDS, true]
      cards_layout_options:
        background_color: "#3F51B5"
        font_family: Roboto
  # Image lightbox for screenshots (Nautobot, Grafana, etc.).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: auto
      height: auto
      zoomable: true
      draggable: true
  # 301 redirects when slugs/paths change. Add entries as you rename pages.
  - redirects:
      redirect_maps: {}
  # HTML/CSS/JS minification for smaller pages.
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

